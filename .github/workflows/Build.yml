name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and Prepare Files
        run: |
          unzip -o fileflex.zip -d ./
          cp -n .env.example .env || touch .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileFlex-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
