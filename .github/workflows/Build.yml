name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP and Prepare Environment
        run: |
          unzip -o fileflex.zip -d ./
          cp -n .env.example .env || touch .env

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradlew Script Directly
        run: |
          curl -s -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -x test -x lint

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileFlex-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
